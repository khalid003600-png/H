name: Build WolFox 1.8.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_ids:
        description: "Bundle IDs مفصولة بفاصلة (اختياري)"
        required: false
        default: "sa.gov.moia.mosques-2"

permissions:
  contents: read

concurrency:
  group: wolfox-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Linux tests and iOS arm64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      WOLFOX_TARGET_BUNDLE_IDS: ${{ inputs.bundle_ids || 'sa.gov.moia.mosques-2' }}
      WOLFOX_PANEL_BASE_URL: https://wolfox.bitsyscore.com/api/v1
      WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install static-test dependency
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ripgrep

      - name: Run static compatibility checks
        run: |
          chmod +x ./*.sh tools/*.sh
          ./run_all_linux_tests.sh
          ./test_build_compatibility_static.sh

      - name: Validate License Hub configuration
        run: |
          test -n "$WOLFOX_PROJECT_KEY" || { echo "::error::Missing WOLFOX_PROJECT_KEY repository secret"; exit 1; }

      - name: Build rootful and rootless DEB packages
        run: |
          ./wolfox_setup_build.sh

      - name: Verify package outputs
        run: |
          test -f WolFox.dylib
          find . -maxdepth 1 -type f -name 'WolFox*_Rootful.deb' -print -quit | grep -q .
          find . -maxdepth 1 -type f -name 'WolFox*_Rootless.deb' -print -quit | grep -q .

      - name: Upload WolFox packages
        uses: actions/upload-artifact@v4
        with:
          name: WolFox-iOS-arm64-${{ github.run_number }}
          path: |
            WolFox.dylib
            WolFox*_Rootful.deb
            WolFox*_Rootless.deb
          if-no-files-found: error
          retention-days: 14
