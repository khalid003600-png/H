name: Validate WolFox PR (No Secrets)

on:
  pull_request:
    branches: [main]
    paths:
      - '*.m'
      - '*.mm'
      - '*.h'
      - '*.sh'
      - 'tools/**'
      - '.github/workflows/validate-wolfox-pr.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      SDK_RELEASE_TAG: master-146e41f
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential ca-certificates clang curl dpkg-dev fakeroot file git libplist-dev libssl-dev libxml2-dev lld llvm make patch perl pkg-config python3 ripgrep xz-utils zlib1g-dev

      - name: Install Theos and SDK
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          SDK_BASE="https://github.com/theos/sdks/releases/download/${SDK_RELEASE_TAG}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" "$SDK_BASE/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          WEBKIT_16="$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/WebKit.framework"
          if [ ! -d "$WEBKIT_16/Headers" ] || [ ! -f "$WEBKIT_16/WebKit.tbd" ]; then
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" "$SDK_BASE/iPhoneOS13.7.sdk.tar.xz"
            tar -xJf "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" -C "$THEOS/sdks"
            WEBKIT_13="$THEOS/sdks/iPhoneOS13.7.sdk/System/Library/Frameworks/WebKit.framework"
            mkdir -p "$WEBKIT_16"
            [ -d "$WEBKIT_16/Headers" ] || cp -a "$WEBKIT_13/Headers" "$WEBKIT_16/Headers"
            [ -f "$WEBKIT_16/WebKit.tbd" ] || cp "$WEBKIT_13/WebKit.tbd" "$WEBKIT_16/WebKit.tbd"
          fi

      - name: Build ldid
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ProcursusTeam/ldid.git "$RUNNER_TEMP/ldid-src"
          make -C "$RUNNER_TEMP/ldid-src" -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/ldid-src/ldid" "$RUNNER_TEMP/bin/ldid"

      - name: Compile with non-production test configuration
        env:
          WOLFOX_PROJECT_KEY: compile-validation-placeholder
          WOLFOX_PANEL_BASE_URL: https://example.invalid/api/v1
          WOLFOX_VERSION: 2.0.0-pr
        run: |
          chmod +x ./*.sh ./tools/*.sh
          python3 apply_fakegpswfx_ui.py
          THEOS="$THEOS" SDKROOT="$THEOS/sdks/iPhoneOS16.5.sdk" LDID="$RUNNER_TEMP/bin/ldid" MIN_IOS=15.0 REQUIRED_SDK_VERSION=16.5 WOLFOX_ARCHS=arm64 WOLFOX_TARGET_BUNDLE_IDS="sa.gov.moia.mosques-2" WOLFOX_PANEL_BASE_URL="$WOLFOX_PANEL_BASE_URL" WOLFOX_PROJECT_KEY="$WOLFOX_PROJECT_KEY" WOLFOX_VERSION="$WOLFOX_VERSION" WOLFOX_REQUIRE_SIGNING=1 WOLFOX_HARDENING=1 ./build_v1_deb.sh

      - name: Verify compile outputs only
        run: |
          test -s WolFox.dylib
          file WolFox.dylib
