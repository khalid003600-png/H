name: WolFox Android Module APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-module/**'
      - '.github/workflows/android-module-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build WolFox Module APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-module

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build release APK
        run: gradle --no-daemon clean assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 20
          sha256sum "$APK" | tee SHA256SUMS.txt
          cp "$APK" WolFox-GPS-Module-v2.0.0-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WolFox-GPS-Module-v2.0.0-APK
          path: |
            android-module/WolFox-GPS-Module-v2.0.0-release.apk
            android-module/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
