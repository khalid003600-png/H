name: Build WolFox All Editions

on:
  workflow_dispatch:
    inputs:
      bundle_ids:
        description: "Bundle IDs مفصولة بفاصلة"
        required: false
        default: "sa.gov.moia.mosques-2"
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-all-editions.yml'
      - 'build_full_jailbreak_core.sh'
      - 'build_wolfox_core.sh'
      - '06_WolFox_Framework_Core/**'

permissions:
  contents: read

concurrency:
  group: wolfox-all-editions-${{ github.ref }}
  cancel-in-progress: true

env:
  WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
  WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
  WOLFOX_TARGET_BUNDLE_IDS: ${{ inputs.bundle_ids || 'sa.gov.moia.mosques-2' }}

jobs:
  lite-jailbreak:
    name: Lite Jailbreak 2.0.0 (Rootful + Rootless)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      WOLFOX_EDITION: Lite
      WOLFOX_VERSION: 2.0.0-Lite
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: chmod +x ./*.sh tools/*.sh
      - run: ./run_all_linux_tests.sh
      - run: ./wolfox_setup_build.sh
      - name: Normalize Lite Jailbreak outputs
        run: |
          cp WolFoxLite.dylib WolFoxLiteJailbreak.dylib
          cp WolFoxLite_v2.0.0-Lite_iOS15.8-26.5_Rootful.deb WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb
          cp WolFoxLite_v2.0.0-Lite_iOS15.8-26.5_Rootless.deb WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb
      - name: Verify Lite Jailbreak outputs
        run: |
          test -s WolFoxLiteJailbreak.dylib
          test -s WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb
          test -s WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb
          file WolFoxLiteJailbreak.dylib
          dpkg-deb --info WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb >/dev/null
          dpkg-deb --info WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb >/dev/null
          sha256sum WolFoxLiteJailbreak.dylib WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb > SHA256SUMS-Lite-Jailbreak.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-GPS-Lite-Jailbreak-2.0.0-${{ github.run_number }}
          if-no-files-found: error
          path: |
            WolFoxLiteJailbreak.dylib
            WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb
            WolFoxGPS-Lite-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb
            SHA256SUMS-Lite-Jailbreak.txt

  full-jailbreak:
    name: Full Jailbreak 2.0.0 + WolFoxCore (Rootful + Rootless)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      WOLFOX_EDITION: Full
      WOLFOX_VERSION: 2.0.0-Full
      WOLFOX_CORE_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: chmod +x ./*.sh tools/*.sh
      - run: ./run_all_linux_tests.sh
      - name: Build base Full packages and toolchain
        run: ./wolfox_setup_build.sh
      - name: Build persistent ldid for Core steps
        run: |
          rm -rf /tmp/wolfox-ldid
          git clone --quiet --depth 1 --recurse-submodules https://github.com/ProcursusTeam/ldid.git /tmp/wolfox-ldid
          make -C /tmp/wolfox-ldid -j"$(nproc)"
          test -x /tmp/wolfox-ldid/ldid
          echo "LDID=/tmp/wolfox-ldid/ldid" >> "$GITHUB_ENV"
      - name: Build shared WolFoxCore
        run: ./build_wolfox_core.sh
      - name: Rebuild Full Jailbreak against WolFoxCore
        run: ./build_full_jailbreak_core.sh
      - name: Normalize Full Jailbreak outputs
        run: |
          cp WolFox_v2.0.0-Full_iOS15.8-26.5_Rootful.deb WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb
          cp WolFox_v2.0.0-Full_iOS15.8-26.5_Rootless.deb WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb
      - name: Verify Full Jailbreak Core dependency
        run: |
          test -s WolFoxFullJailbreak.dylib
          test -s WolFoxCore.dylib
          test -s WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb
          test -s WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb
          dpkg-deb -f WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb Depends | grep -F 'com.wolfox.core'
          dpkg-deb -f WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb Depends | grep -F 'com.wolfox.core'
          file WolFoxFullJailbreak.dylib WolFoxCore.dylib
          sha256sum WolFoxFullJailbreak.dylib WolFoxCore.dylib WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb > SHA256SUMS-Full-Jailbreak.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-GPS-Full-Jailbreak-Core-2.0.0-${{ github.run_number }}
          if-no-files-found: error
          path: |
            WolFoxFullJailbreak.dylib
            WolFoxCore.dylib
            WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootful.deb
            WolFoxGPS-Full-Jailbreak-v2.0.0-iOS15.8-26.5-Rootless.deb
            SHA256SUMS-Full-Jailbreak.txt
