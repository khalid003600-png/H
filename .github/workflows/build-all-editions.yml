name: Build WolFox All Editions

on:
  workflow_dispatch:
    inputs:
      bundle_ids:
        description: "Bundle IDs مفصولة بفاصلة"
        required: false
        default: "sa.gov.moia.mosques-2"

permissions:
  contents: read

concurrency:
  group: wolfox-all-editions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lite-jailbreak:
    name: Lite Jailbreak (Rootful + Rootless)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      WOLFOX_TARGET_BUNDLE_IDS: ${{ inputs.bundle_ids || 'sa.gov.moia.mosques-2' }}
      WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
      WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
      WOLFOX_EDITION: Lite
      WOLFOX_VERSION: 1.8.6-Lite
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./*.sh tools/*.sh
      - run: ./run_all_linux_tests.sh
      - run: ./wolfox_setup_build.sh
      - run: |
          test -s WolFoxLite.dylib
          test -s WolFoxLite_v1.8.6-Lite_iOS15.8-26.5_Rootful.deb
          test -s WolFoxLite_v1.8.6-Lite_iOS15.8-26.5_Rootless.deb
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-Lite-Jailbreak-${{ github.run_number }}
          if-no-files-found: error
          path: |
            WolFoxLite.dylib
            WolFoxLite_v1.8.6-Lite_iOS15.8-26.5_Rootful.deb
            WolFoxLite_v1.8.6-Lite_iOS15.8-26.5_Rootless.deb

  full-jailbreak:
    name: Full Jailbreak (Rootful + Rootless)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      WOLFOX_TARGET_BUNDLE_IDS: ${{ inputs.bundle_ids || 'sa.gov.moia.mosques-2' }}
      WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
      WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
      WOLFOX_EDITION: Full
      WOLFOX_VERSION: 1.8.6-Full
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./*.sh tools/*.sh
      - run: ./run_all_linux_tests.sh
      - run: ./wolfox_setup_build.sh
      - run: |
          test -s WolFox.dylib
          test -s WolFox_v1.8.6-Full_iOS15.8-26.5_Rootful.deb
          test -s WolFox_v1.8.6-Full_iOS15.8-26.5_Rootless.deb
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-Full-Jailbreak-${{ github.run_number }}
          if-no-files-found: error
          path: |
            WolFox.dylib
            WolFox_v1.8.6-Full_iOS15.8-26.5_Rootful.deb
            WolFox_v1.8.6-Full_iOS15.8-26.5_Rootless.deb

  lite-jailed-prep:
    name: Lite Jailed / IPA prep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WOLFOX_TARGET_BUNDLE_IDS: ${{ inputs.bundle_ids || 'sa.gov.moia.mosques-2' }}
      WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
      WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
      WOLFOX_EDITION: Lite
      WOLFOX_VERSION: 1.8.6-Lite
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./*.sh tools/*.sh
      - run: ./run_all_linux_tests.sh
      - name: Prepare Lite jailed payload
        run: |
          mkdir -p dist/lite-jailed
          cp -a *.m *.mm *.h Makefile* control* dist/lite-jailed/ 2>/dev/null || true
          printf '%s\n' 'Lite jailed payload prepared. Final IPA signing/injection requires a signed target IPA or macOS signing environment.' > dist/lite-jailed/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-Lite-Jailed-Prep-${{ github.run_number }}
          path: dist/lite-jailed
          if-no-files-found: error

  full-jailed-prep:
    name: Full Jailed / IPA prep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WOLFOX_TARGET_BUNDLE_IDS: ${{ inputs.bundle_ids || 'sa.gov.moia.mosques-2' }}
      WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
      WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
      WOLFOX_EDITION: Full
      WOLFOX_VERSION: 1.8.6-Full
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./*.sh tools/*.sh
      - run: ./run_all_linux_tests.sh
      - name: Prepare Full jailed payload
        run: |
          mkdir -p dist/full-jailed
          cp -a *.m *.mm *.h Makefile* control* dist/full-jailed/ 2>/dev/null || true
          printf '%s\n' 'Full jailed payload prepared. Final IPA signing/injection requires a signed target IPA or macOS signing environment.' > dist/full-jailed/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-Full-Jailed-Prep-${{ github.run_number }}
          path: dist/full-jailed
          if-no-files-found: error
