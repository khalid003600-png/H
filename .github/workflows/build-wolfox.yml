name: Build FAKE GPS WFX Full 2.0.0

on:
  workflow_dispatch:
    inputs:
      bundle_ids:
        description: "Comma-separated target app Bundle IDs"
        required: true
        default: "sa.gov.moia.mosques-2"
  push:
    branches: [main]
    paths:
      - 'WolFoxMaster.mm'
      - 'build_v1_deb.sh'
      - 'apply_fakegpswfx_ui.py'
      - '.github/workflows/build-wolfox.yml'

permissions:
  contents: read

concurrency:
  group: fake-gps-wfx-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: FAKE GPS WFX Full arm64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      SDK_RELEASE_TAG: "master-146e41f"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential ca-certificates clang curl dpkg-dev fakeroot file git libplist-dev libssl-dev libxml2-dev lld llvm make patch perl pkg-config python3 ripgrep xz-utils zlib1g-dev

      - name: Apply and validate FAKE GPS WFX source patch
        run: |
          chmod +x ./*.sh ./tools/*.sh
          python3 apply_fakegpswfx_ui.py
          grep -F 'FAKE GPS WFX' WolFoxMaster.mm >/dev/null
          grep -F 'PACKAGE_TITLE="FAKE GPS WFX"' build_v1_deb.sh >/dev/null
          grep -F 'VERSION="${WOLFOX_VERSION:-2.0.0}"' build_v1_deb.sh >/dev/null
          grep -F 'WOLFOX_ARCHS="${WOLFOX_ARCHS:-arm64}"' build_v1_deb.sh >/dev/null

      - name: Install Theos and iOS SDKs
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          SDK_BASE="https://github.com/theos/sdks/releases/download/${SDK_RELEASE_TAG}"
          curl --fail --location --retry 3 --retry-delay 2 --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" "$SDK_BASE/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          WEBKIT_16="$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/WebKit.framework"
          if [ ! -d "$WEBKIT_16/Headers" ] || [ ! -f "$WEBKIT_16/WebKit.tbd" ]; then
            curl --fail --location --retry 3 --retry-delay 2 --output "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" "$SDK_BASE/iPhoneOS13.7.sdk.tar.xz"
            tar -xJf "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" -C "$THEOS/sdks"
            WEBKIT_13="$THEOS/sdks/iPhoneOS13.7.sdk/System/Library/Frameworks/WebKit.framework"
            mkdir -p "$WEBKIT_16"
            [ -d "$WEBKIT_16/Headers" ] || cp -a "$WEBKIT_13/Headers" "$WEBKIT_16/Headers"
            [ -f "$WEBKIT_16/WebKit.tbd" ] || cp "$WEBKIT_13/WebKit.tbd" "$WEBKIT_16/WebKit.tbd"
          fi

      - name: Build ldid
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/ProcursusTeam/ldid.git "$RUNNER_TEMP/ldid-src"
          make -C "$RUNNER_TEMP/ldid-src" -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/ldid-src/ldid" "$RUNNER_TEMP/bin/ldid"

      - name: Validate License Hub configuration
        env:
          WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
        run: test -n "$WOLFOX_PROJECT_KEY" || { echo "::error::Missing WOLFOX_PROJECT_KEY repository secret"; exit 1; }

      - name: Build FAKE GPS WFX Rootful and Rootless
        env:
          MANUAL_BUNDLE_IDS: ${{ inputs.bundle_ids }}
          WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
          WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
          WOLFOX_VERSION: 2.0.0
        run: |
          BUNDLE_IDS="${MANUAL_BUNDLE_IDS:-sa.gov.moia.mosques-2}"
          THEOS="$THEOS" SDKROOT="$THEOS/sdks/iPhoneOS16.5.sdk" LDID="$RUNNER_TEMP/bin/ldid" MIN_IOS=15.0 REQUIRED_SDK_VERSION=16.5 WOLFOX_ARCHS=arm64 WOLFOX_TARGET_BUNDLE_IDS="$BUNDLE_IDS" WOLFOX_PANEL_BASE_URL="$WOLFOX_PANEL_BASE_URL" WOLFOX_PROJECT_KEY="$WOLFOX_PROJECT_KEY" WOLFOX_VERSION="$WOLFOX_VERSION" WOLFOX_REQUIRE_SIGNING=1 WOLFOX_HARDENING=1 ./build_v1_deb.sh

      - name: Normalize FAKE GPS WFX filenames
        run: |
          test -s WolFox.dylib
          test -s WolFox_v2.0.0_iOS15.8-26.5_Rootful.deb
          test -s WolFox_v2.0.0_iOS15.8-26.5_Rootless.deb
          mv WolFox.dylib FAKEGPSWFX.dylib
          mv WolFox_v2.0.0_iOS15.8-26.5_Rootful.deb FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootful.deb
          mv WolFox_v2.0.0_iOS15.8-26.5_Rootless.deb FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootless.deb

      - name: Verify FAKE GPS WFX build products
        run: |
          test -s FAKEGPSWFX.dylib
          test -s FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootful.deb
          test -s FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootless.deb
          file FAKEGPSWFX.dylib
          strings FAKEGPSWFX.dylib | grep -F "FAKE GPS WFX"
          dpkg-deb --info FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootful.deb
          dpkg-deb --info FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootless.deb
          sha256sum FAKEGPSWFX.dylib FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootful.deb FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootless.deb > SHA256SUMS.txt

      - name: Upload FAKE GPS WFX packages
        uses: actions/upload-artifact@v4
        with:
          name: FAKE-GPS-WFX-Full-v2.0.0-iOS15.8-26.5-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            FAKEGPSWFX.dylib
            FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootful.deb
            FAKEGPSWFX-v2.0.0-iOS15.8-26.5-Rootless.deb
            SHA256SUMS.txt
