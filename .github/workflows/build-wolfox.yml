name: Build WolFox 1.8.2

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bundle_ids:
        description: "Comma-separated target app Bundle IDs"
        required: true
        default: "sa.gov.moia.mosques-2"

permissions:
  contents: read

concurrency:
  group: wolfox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Linux tests and iOS arm64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/.theos
      SDK_VERSION: "16.5"
      SDK_RELEASE_TAG: "master-146e41f"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential ca-certificates clang curl dpkg-dev fakeroot file git \
            libplist-dev libssl-dev libxml2-dev lld llvm make patch perl pkg-config \
            python3 ripgrep xz-utils zlib1g-dev

      - name: Run Linux validation
        run: |
          chmod +x ./*.sh ./tools/*.sh
          ./run_all_linux_tests.sh

      - name: Install Theos and iOS SDKs
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"

          SDK_BASE="https://github.com/theos/sdks/releases/download/${SDK_RELEASE_TAG}"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            "$SDK_BASE/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"

          WEBKIT_16="$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/WebKit.framework"
          if [ ! -d "$WEBKIT_16/Headers" ] || [ ! -f "$WEBKIT_16/WebKit.tbd" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              --output "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" \
              "$SDK_BASE/iPhoneOS13.7.sdk.tar.xz"
            tar -xJf "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" -C "$THEOS/sdks"
            WEBKIT_13="$THEOS/sdks/iPhoneOS13.7.sdk/System/Library/Frameworks/WebKit.framework"
            mkdir -p "$WEBKIT_16"
            [ -d "$WEBKIT_16/Headers" ] || cp -a "$WEBKIT_13/Headers" "$WEBKIT_16/Headers"
            [ -f "$WEBKIT_16/WebKit.tbd" ] || cp "$WEBKIT_13/WebKit.tbd" "$WEBKIT_16/WebKit.tbd"
          fi

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$WEBKIT_16/Headers"
          test -f "$WEBKIT_16/WebKit.tbd"

      - name: Build ldid
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/ProcursusTeam/ldid.git "$RUNNER_TEMP/ldid-src"
          make -C "$RUNNER_TEMP/ldid-src" -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/ldid-src/ldid" "$RUNNER_TEMP/bin/ldid"

      - name: Build signed Rootful and Rootless packages
        env:
          MANUAL_BUNDLE_IDS: ${{ inputs.bundle_ids }}
          WOLFOX_PANEL_BASE_URL: ${{ secrets.WOLFOX_PANEL_BASE_URL }}
          WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
        run: |
          BUNDLE_IDS="${MANUAL_BUNDLE_IDS:-sa.gov.moia.mosques-2}"
          THEOS="$THEOS" \
          SDKROOT="$THEOS/sdks/iPhoneOS16.5.sdk" \
          LDID="$RUNNER_TEMP/bin/ldid" \
          MIN_IOS=15.0 \
          REQUIRED_SDK_VERSION=16.5 \
          WOLFOX_ARCHS=arm64 \
          WOLFOX_TARGET_BUNDLE_IDS="$BUNDLE_IDS" \
          WOLFOX_PANEL_BASE_URL="$WOLFOX_PANEL_BASE_URL" \
          WOLFOX_PROJECT_KEY="$WOLFOX_PROJECT_KEY" \
          WOLFOX_REQUIRE_SIGNING=1 \
          WOLFOX_HARDENING=1 \
            ./build_v1_deb.sh

      - name: Verify build products
        run: |
          test -s WolFox.dylib
          test -s WolFox_v1.8.2-Full_iOS15.8-26.5_Rootful.deb
          test -s WolFox_v1.8.2-Full_iOS15.8-26.5_Rootless.deb
          file WolFox.dylib
          dpkg-deb --info WolFox_v1.8.2-Full_iOS15.8-26.5_Rootful.deb
          dpkg-deb --info WolFox_v1.8.2-Full_iOS15.8-26.5_Rootless.deb

      - name: Upload WolFox packages
        uses: actions/upload-artifact@v4
        with:
          name: WolFox-1.8.2-iOS15.8-26.5-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            WolFox.dylib
            WolFox_v1.8.2-Full_iOS15.8-26.5_Rootful.deb
            WolFox_v1.8.2-Full_iOS15.8-26.5_Rootless.deb
