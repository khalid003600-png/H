name: Build WolFox WhatsApp Location
# Dedicated DEB + dylib build for the WhatsApp-only edition.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'whatsapp/**'
      - 'build_whatsapp_location.sh'
      - '.github/workflows/build-whatsapp-location.yml'
      - 'WFLicenseClient.*'
      - 'WFActivationViewController.*'
      - 'WolFoxProStore.*'
      - 'WolFoxProHookManager.*'
      - 'WolFoxProTheme.*'
      - 'WFRedactedLogger.*'

permissions:
  contents: read

concurrency:
  group: wolfox-whatsapp-location-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/.theos
  WOLFOX_WHATSAPP_VERSION: 1.0.0
  WOLFOX_PANEL_BASE_URL: https://gps.p3nd.fun/api/v1
  WOLFOX_PROJECT_KEY: ${{ secrets.WOLFOX_PROJECT_KEY }}
  WOLFOX_PROJECT_BUNDLE_ID: com.wolfox.gpspro

jobs:
  build:
    name: WhatsApp Location 1.0.0 (Rootful + Rootless)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential ca-certificates clang curl dpkg-dev fakeroot file git \
            libplist-dev libssl-dev lld llvm make pkg-config ripgrep unzip wget xz-utils zip zlib1g-dev

      - name: Install Theos and iPhoneOS 16.5 SDK
        run: |
          git clone --quiet --depth 1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl --fail --location --retry 3 \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"

      - name: Build ldid
        run: |
          git clone --quiet --depth 1 --recurse-submodules https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j"$(nproc)"
          test -x /tmp/ldid/ldid

      - name: Build WhatsApp Location
        env:
          SDKROOT: ${{ github.workspace }}/.theos/sdks/iPhoneOS16.5.sdk
          LDID: /tmp/ldid/ldid
          MIN_IOS: 15.0
          REQUIRED_SDK_VERSION: 16.5
        run: |
          chmod +x build_whatsapp_location.sh
          ./build_whatsapp_location.sh

      - name: Verify outputs
        run: |
          test -s WolFoxWhatsAppLocation.dylib
          test -s WolFox-WhatsApp-Location-v1.0.0-iOS15.8-26.5-Rootful.deb
          test -s WolFox-WhatsApp-Location-v1.0.0-iOS15.8-26.5-Rootless.deb
          file WolFoxWhatsAppLocation.dylib
          dpkg-deb --info WolFox-WhatsApp-Location-v1.0.0-iOS15.8-26.5-Rootful.deb >/dev/null
          dpkg-deb --info WolFox-WhatsApp-Location-v1.0.0-iOS15.8-26.5-Rootless.deb >/dev/null
          cat SHA256SUMS-WhatsApp-Location.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-WhatsApp-Location-v1.0.0-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 90
          path: |
            WolFoxWhatsAppLocation.dylib
            WolFox-WhatsApp-Location-v1.0.0-iOS15.8-26.5-Rootful.deb
            WolFox-WhatsApp-Location-v1.0.0-iOS15.8-26.5-Rootless.deb
            SHA256SUMS-WhatsApp-Location.txt
